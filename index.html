<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le temps d'un cookie – Nos produits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --peche:#FECFB5; --peche-clair:#FFE6D8; --creme:#FFF7F0;
  --brun:#3E1C12; --brun-doux:#7A4A3A;
  --cookie:#F5B97B; --cookie-fonce:#E39A52;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--creme);color:var(--brun);font-family:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto}

header{background:var(--peche);text-align:center;padding:28px 20px 36px;border-radius:0 0 40px 40px}
header img{width:min(78%,340px);height:auto;display:block;margin:0 auto}
header p{margin:14px auto 0;max-width:420px;font-size:1.02rem;color:var(--brun-doux)}

main{padding:0 16px;margin-top:24px}
.card{background:#fff;border:2px solid var(--brun);border-radius:22px;margin-bottom:14px;box-shadow:0 4px 0 var(--brun);overflow:hidden}
.card summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 18px;font-weight:600;font-size:1.2rem;-webkit-tap-highlight-color:transparent}
.card summary::-webkit-details-marker{display:none}
.card summary .nom{flex:1}
.chev{flex:none;width:32px;height:32px;border-radius:50%;background:var(--cookie);display:grid;place-items:center;transition:transform .2s}
.chev::before{content:"";width:8px;height:8px;border-right:3px solid var(--brun);border-bottom:3px solid var(--brun);transform:translateY(-2px) rotate(45deg)}
.card[open] .chev{transform:rotate(180deg)}
.card[open] summary{background:var(--peche-clair);border-bottom:2px dashed var(--cookie-fonce)}
.corps{padding:16px 18px 20px}
.corps h3{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cookie-fonce);font-weight:600;margin-bottom:6px}
.corps p{font-size:1rem;margin-bottom:16px}
.corps em{font-style:italic;font-size:.88em}
.allergenes{background:var(--peche-clair);border:2px solid var(--cookie);border-radius:16px;padding:12px 14px}
.allergenes h3{color:var(--brun)}
.pastilles{display:flex;flex-wrap:wrap;gap:8px}
.pastilles span{background:#fff;border:2px solid var(--brun);border-radius:999px;padding:3px 12px;font-size:.88rem;font-weight:600}
.aucun{font-size:.95rem;color:var(--brun-doux);margin:0!important}

footer{text-align:center;padding:14px 20px 40px;color:var(--brun-doux);font-size:.92rem}
.contacts{display:flex;flex-direction:column;align-items:center;gap:12px}
.contacts a{display:inline-flex;align-items:center;gap:12px;width:min(100%,300px);justify-content:flex-start;background:var(--brun);color:var(--peche);text-decoration:none;border-radius:999px;padding:9px 22px 9px 10px;font-weight:600;font-size:1.02rem;box-shadow:0 4px 0 var(--cookie-fonce);transition:transform .12s,box-shadow .12s}
.contacts a:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--cookie-fonce)}
.contacts a:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cookie-fonce)}
.contacts .ico{flex:none;width:36px;height:36px;border-radius:50%;background:var(--cookie);display:grid;place-items:center}
.contacts .ico svg{width:20px;height:20px;stroke:var(--brun);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.contacts .ico svg .plein{fill:var(--brun);stroke:none}
</style>
</head>

/* ===================== FIN DE LA PARTIE A MODIFIER ==================== */

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}

// Met en italique (et un peu plus petit) tout ce qui est entre parenthèses ( ) ou crochets [ ]
function sousIngredients(s){
  var out='',depth=0;
  for(var i=0;i<s.length;i++){
    var ch=s.charAt(i);
    if(ch==='('||ch==='['){ if(depth===0) out+='<em>'; depth++; out+=esc(ch); }
    else if((ch===')'||ch===']')&&depth>0){ out+=esc(ch); depth--; if(depth===0) out+='</em>'; }
    else out+=esc(ch);
  }
  if(depth>0) out+='</em>';
  return out;
}

document.getElementById('liste').innerHTML = PRODUITS.map(function(p,i){

    ? '<div class="pastilles">'+p.allergenes.map(function(a){return '<span>'+esc(a)+'</span>'}).join('')+'</div>'
    : '<p class="aucun">Aucun des 14 allergènes majeurs.</p>';
  return '<details class="card"'+(i===0?' open':'')+'>'
    +'<summary><span class="nom">'+esc(p.nom)+'</span><span class="chev" aria-hidden="true"></span></summary>'
    +'<div class="corps"><h3>Ingrédients</h3><p>'+sousIngredients(p.ingredients)+'</p>'
    +'<div class="allergenes"><h3>Allergènes présents</h3>'+alg+'</div></div></details>';
}).join('');
